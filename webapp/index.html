<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Rastreamento de ativos</title>

        <style>
        html,
        body,
        body>div,
        #container,
        #container-uiarea {
            height: 100%;
        }

        /* ISOLAMENTO: O fundo do caminhão só se aplica na View de Login */
        div[id$="---Login"].sapMPage,
        div[id$="---Login"] .sapMPage,
        div[id$="---Login"] .sapMPageBgStandard,
        div[id$="---Login"] .loginBackground {
            background-image: url("img/background.png") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-color: transparent !important;
        }

        /* O painel branco fica restrito ao contêiner de Login */
        div[id$="---Login"] .sapMPanel {
            background-color: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            border-top: 4px solid #0f172a !important;
            border-radius: 12px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2) !important;
        }

        /* Altera as cores dos textos apenas dentro do Login */
        div[id$="---Login"] .sapMLbl,
        div[id$="---Login"] .sapMTitle,
        div[id$="---Login"] .sapMText {
            color: #1e293b !important;
        }

        div[id$="---Login"] .sapMTitle {
            font-weight: 700 !important;
        }

        /* O aumento de fontes das legendas só afeta a tela de Login */
        div[id$="---Login"] .fonteExpandidaLogin .sapMLbl {
            font-size: 16px !important;
            font-weight: 600 !important;
            margin-top: 12px !important;
            margin-bottom: 6px !important;
        }

        /* O aumento da altura e texto dos inputs só afeta a tela de Login */
        div[id$="---Login"] .fonteExpandidaLogin .sapMInputBaseInner {
            font-size: 16px !important;
            height: 44px !important;
        }
    </style>


    <!-- Leaflet -->
    <link rel="stylesheet" href="libs/leaflet/dist/leaflet.css" />
    <script src="libs/leaflet/dist/leaflet.js"></script>

    <!-- Marker Cluster -->
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.Default.css" />
    <script src="libs/leaflet-markercluster/leaflet.markercluster.js"></script>

    <script id="sap-ui-bootstrap" src="resources/sap-ui-core.js" data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "br.com.smartpcm.rastreamento.zrastreio": "./"
        }' data-sap-ui-on-init="module:sap/ui/core/ComponentSupport" data-sap-ui-compat-version="edge"
        data-sap-ui-async="true" data-sap-ui-frame-options="trusted">
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component data-name="br.com.smartpcm.rastreamento.zrastreio" data-id="container"
        data-settings='{"id":"br.com.smartpcm.rastreamento.zrastreio"}' data-handle-validation="true">
    </div>
</body>

</html>
